name: sigo-dental

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigo-dental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigo_dental}
      POSTGRES_USER: ${POSTGRES_USER:-sigo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_256}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "ssl=off"
      - "-c"
      - "max_connections=250"
    volumes:
      - postgres_encrypted_data:/var/lib/postgresql/data
    networks:
      - sigo_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sigo_admin} -d $${POSTGRES_DB:-sigo_dental}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sigo-dental-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]
    volumes:
      - redis_session_data:/data
    networks:
      - sigo_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: sigo-dental-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sigo_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_secret_key}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_clinical_blobs:/data
    networks:
      - sigo_internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  clinical-agenda:
    build:
      context: ../services/clinical-agenda
      dockerfile: Dockerfile
    container_name: sigo-dental-clinical-agenda
    restart: unless-stopped
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-sigo_admin}:${POSTGRES_PASSWORD:-change_me_postgres_256}@postgres:5432/${POSTGRES_DB:-sigo_dental}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      JWT_SECRET: ${JWT_SECRET:-sigo-dental-production-hs256-secret-key-2026}
      SESSION_IDLE_TTL_SECONDS: "900"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - sigo_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  billing-stock:
    build:
      context: ../services/billing-stock
      dockerfile: Dockerfile
    container_name: sigo-dental-billing-stock
    restart: unless-stopped
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://${POSTGRES_USER:-sigo_admin}:${POSTGRES_PASSWORD:-change_me_postgres_256}@postgres:5432/${POSTGRES_DB:-sigo_dental}?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigo_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: sigo-dental-api-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:8080"
      - "${GATEWAY_HTTPS_PORT:-8443}:8443"
    environment:
      PORT: "8080"
      TLS_PORT: "8443"
      TLS_MIN_VERSION: "1.3"
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      REDIS_ADDR: redis:6379
      CLINICAL_AGENDA_UPSTREAM: http://clinical-agenda:8081
      BILLING_STOCK_UPSTREAM: http://billing-stock:8082
      JWT_SECRET: ${JWT_SECRET:-sigo-dental-production-hs256-secret-key-2026}
      SESSION_IDLE_TTL_SECONDS: "900"
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://portal.sigo-dental.local}
      OPENAPI_SPEC_PATH: /app/openapi/sigo-dental.v1.yaml
    depends_on:
      redis:
        condition: service_healthy
      clinical-agenda:
        condition: service_healthy
      billing-stock:
        condition: service_healthy
    networks:
      - sigo_internal
      - sigo_edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sigo-dental-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-https://localhost:8443}
      NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MS: "900000"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - sigo_edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  sigo_internal:
    driver: bridge
    internal: true
  sigo_edge:
    driver: bridge

volumes:
  postgres_encrypted_data:
    driver: local
  redis_session_data:
    driver: local
  minio_clinical_blobs:
    driver: local
