name: sigo-dental

services:
  postgres:
    image: postgres:16-alpine
    container_name: sigo-dental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigo_dental}
      POSTGRES_USER: ${POSTGRES_USER:-sigo_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_256}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "ssl=off"
      - "-c"
      - "max_connections=250"
    volumes:
      - postgres_encrypted_data:/var/lib/postgresql/data
    networks:
      - sigo_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sigo_admin} -d $${POSTGRES_DB:-sigo_dental}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sigo-dental-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]
    volumes:
      - redis_session_data:/data
    networks:
      - sigo_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: sigo-dental-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-sigo_rustfs_admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-change_me_rustfs_secret_key}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs_clinical_blobs:/data
    networks:
      - sigo_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  clinical-agenda:
    build:
      context: ../services/clinical-agenda
      dockerfile: Dockerfile
    container_name: sigo-dental-clinical-agenda
    restart: unless-stopped
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-sigo_admin}:${POSTGRES_PASSWORD:-change_me_postgres_256}@postgres:5432/${POSTGRES_DB:-sigo_dental}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://rustfs:9000
      JWT_SECRET: ${JWT_SECRET:-sigo-dental-production-hs256-secret-key-2026}
      SESSION_IDLE_TTL_SECONDS: "900"
      # RNF-05 second factor. The development stack turns it OFF so that
      # switching between the 5 seeded roles does not need a TOTP code
      # (wi-18 S1). Set it back to "true" outside local development.
      MFA_REQUIRED: ${MFA_REQUIRED:-false}
      # Seeds the demonstration data set on boot (wi-18 S4).
      SIGO_SEED_DEMO_DATA: ${SIGO_SEED_DEMO_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - sigo_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  billing-stock:
    build:
      context: ../services/billing-stock
      dockerfile: Dockerfile
    container_name: sigo-dental-billing-stock
    restart: unless-stopped
    environment:
      PORT: "8082"
      DATABASE_URL: postgres://${POSTGRES_USER:-sigo_admin}:${POSTGRES_PASSWORD:-change_me_postgres_256}@postgres:5432/${POSTGRES_DB:-sigo_dental}?sslmode=disable
      REDIS_ADDR: redis:6379
      # Seeds the demonstration data set on boot (wi-18 S5).
      SIGO_SEED_DEMO_DATA: ${SIGO_SEED_DEMO_DATA:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigo_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: sigo-dental-api-gateway
    restart: unless-stopped
    ports:
      # Non-default host ports on purpose: this stack is meant to stay running
      # next to other local projects without fighting over 8080/8443.
      - "${GATEWAY_HTTP_PORT:-18080}:8080"
      - "${GATEWAY_HTTPS_PORT:-18443}:8443"
    environment:
      PORT: "8080"
      TLS_PORT: "8443"
      TLS_MIN_VERSION: "1.3"
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      REDIS_ADDR: redis:6379
      CLINICAL_AGENDA_UPSTREAM: http://clinical-agenda:8081
      BILLING_STOCK_UPSTREAM: http://billing-stock:8082
      JWT_SECRET: ${JWT_SECRET:-sigo-dental-production-hs256-secret-key-2026}
      SESSION_IDLE_TTL_SECONDS: "900"
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:18777}
      OPENAPI_SPEC_PATH: /app/openapi/sigo-dental.v1.yaml
    volumes:
      # The gateway loads the contract at startup and exits when it is missing.
      - ../openapi:/app/openapi:ro
    depends_on:
      redis:
        condition: service_healthy
      clinical-agenda:
        condition: service_healthy
      billing-stock:
        condition: service_healthy
    networks:
      sigo_internal: {}
      sigo_edge:
        aliases:
          # The Cloudflare Tunnel ingress of the shared tunnel points to
          # http://gateway:8080. This alias publishes the same container
          # under that name inside the compose network, so the tunnel
          # resolves the origin without changing the panel configuration.
          - gateway
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are inlined at build time; the runtime env below
        # cannot change them once the image exists. The browser talks only to
        # Next (same-origin), so this value is kept for legacy compatibility.
        NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-http://localhost:18080}
        NEXT_PUBLIC_IDLE_TIMEOUT_MS: "900000"
        # Renders the development role picker on the login screen (wi-18 S3).
        # It ships the seeded credentials in the browser bundle: never enable it
        # in a published build, and never while a Cloudflare tunnel exposes
        # this stack to the internet.
        NEXT_PUBLIC_DEV_ROLE_LOGIN: ${NEXT_PUBLIC_DEV_ROLE_LOGIN:-true}
    container_name: sigo-dental-frontend
    restart: unless-stopped
    ports:
      # Same rationale as the gateway: keep the host ports out of the usual
      # 3000 range so another local project can bind it.
      - "${FRONTEND_PORT:-18777}:3000"
    environment:
      NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-http://localhost:18080}
      NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_MS: "900000"
      # Server components and server actions reach the gateway over the
      # internal compose network; the browser never calls it directly.
      GATEWAY_INTERNAL_URL: ${GATEWAY_INTERNAL_URL:-http://api-gateway:8080}
      # The local stack serves the portal over plain HTTP, so the session
      # cookie must not carry the Secure flag here. Set it to "true" when the
      # portal is published behind TLS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - sigo_edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # Cloudflare Tunnel — profile "tunnel"
  # ---------------------------------------------------------------------
  # Named tunnel. The token is read from CLOUDFLARE_TUNNEL_TOKEN in .env
  # (the image is distroless: it has no shell, so the token travels as the
  # TUNNEL_TOKEN environment variable that `cloudflared tunnel run` reads).
  #
  # The routing is NOT defined here: in the Cloudflare Zero Trust dashboard
  # the public hostname must point to the compose service
  #     http://frontend:3000
  # because cloudflared reaches the portal over the internal network.
  #
  # Without a valid token cloudflared exits with code 255 ("requires the ID
  # or name of the tunnel" / "Provided Tunnel token is not valid") and Docker
  # restarts it. The other seven services keep working: the tunnel is an
  # add-on, not a dependency.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sigo-dental-cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - sigo_edge

networks:
  sigo_internal:
    driver: bridge
    internal: true
  sigo_edge:
    driver: bridge

volumes:
  postgres_encrypted_data:
    driver: local
  redis_session_data:
    driver: local
  rustfs_clinical_blobs:
    driver: local
